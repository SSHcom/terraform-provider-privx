# Visit https://golangci-lint.run/ for usage documentation
# and information on other useful linters
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - durationcheck
    - errcheck
    - forcetypeassert
    - godot
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - predeclared
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: unused-parameter
          disabled: true
  exclusions:
    paths:
      - vendor
      - pkg/mod
    rules:
      - path: _test\.go$
        linters:
          - errcheck
          - forcetypeassert
          - godot
          - gosec
          - revive
          - unused

issues:
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      colors: true
